spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

app:
  environment: docker
  security:
    api-docs-public: ${API_DOCS_PUBLIC:false}
    actuator-prometheus-public: ${ACTUATOR_PROMETHEUS_PUBLIC:false}
    actuator-prometheus-username: ${ACTUATOR_PROMETHEUS_USERNAME:}
    actuator-prometheus-password: ${ACTUATOR_PROMETHEUS_PASSWORD:}
    enforce-secure-jwt-secret: true
    jwt:
      secret: ${JWT_SECRET}

management:
  endpoint:
    health:
      show-details: always

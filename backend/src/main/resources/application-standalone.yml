# Smoke / offline profile when PostgreSQL/Redis/Kafka are unavailable.
# Prefer `local` + Docker Compose for full Phase 1 infra verification.

spring:
  datasource:
    url: jdbc:h2:mem:ecommerce_standalone;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  h2:
    console:
      enabled: false

app:
  environment: standalone
  kafka:
    enabled: false
  security:
    api-docs-public: true
    actuator-prometheus-public: true
    enforce-secure-jwt-secret: false
    jwt:
      secret: ${JWT_SECRET:standalone-dev-only-change-me-long-random-secret-key32}

management:
  health:
    redis:
      enabled: false
    db:
      enabled: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
    username: ${DB_USER:ecommerce}
    password: ${DB_PASSWORD:ecommerce}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  environment: local
  stripe:
    mock: ${STRIPE_MOCK:false}
  security:
    api-docs-public: true
    actuator-prometheus-public: true
    enforce-secure-jwt-secret: false
    jwt:
      secret: ${JWT_SECRET:local-dev-only-change-me-to-a-long-random-secret-key-32b}

logging:
  level:
    com.ecommerce.platform: DEBUG
